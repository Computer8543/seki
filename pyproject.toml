[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seki"
version = "0.9.0"
description = "Fail-closed invariant-verification harness for Python AST, architectural layers, and polyglot hygiene."
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.scripts]
seki = "seki.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "regression_sentinel: Permanent CI recurrence-sentinel invariant tests",
    "perf: Latency budget verification tests (<150ms staged diff)",
    "offline: Tests asserting AF_INET/AF_INET6 socket isolation",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S105", "S603", "S607", "UP032", "UP035"]
